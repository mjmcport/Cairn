name: CI

# A change that touches only documents starts no run. A push is judged by the
# commits pushed; a pull request is judged by its whole diff.
on:
  push:
    paths-ignore:
      - "**.md"
      - "plans/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "plans/**"
      - "docs/**"

# A newer push to the same branch or pull request replaces the run in progress.
# Not on main: there each run gets a group of its own, so a second push neither
# cancels the first run nor drops it from the queue (GitHub keeps only one
# pending run per group), and every push to main gets a result and a build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # A push to a branch with an open pull request fires both events. The
  # pull-request run covers the commit, so the macOS job is skipped for the
  # push. This job costs Linux minutes, a tenth of the macOS rate.
  pull-request-lookup:
    name: Look for an open pull request
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.lookup.outputs.open }}
    steps:
      - name: Look up pull requests for this branch
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.repository_owner }}:${{ github.ref_name }}
        run: |
          # Only a count above zero skips the macOS job. A failed lookup, or
          # an answer that is not a number, lets it run.
          count="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$HEAD" --jq length)" || count=unknown
          case "$count" in
            '' | *[!0-9]*) open=false; echo "::warning title=Pull request lookup::The lookup failed ('$count'), so the build runs." ;;
            0) open=false; echo "No open pull request for $HEAD: the build runs." ;;
            *) open=true; echo "$count open pull request(s) for $HEAD: the pull-request run covers this push." ;;
          esac
          echo "open=$open" >> "$GITHUB_OUTPUT"

  check:
    name: Build and test
    needs: pull-request-lookup
    # Runs when the lookup was skipped (a pull request, or main), failed, or
    # found no open pull request.
    if: ${{ !cancelled() && needs.pull-request-lookup.outputs.open != 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      # To read the audit records earlier runs uploaded.
      actions: read
    env:
      # The UI tests and the performance tests run only on pull requests and
      # on main. Other pushes stop after the unit tests.
      FULL_TIER: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Record the start time
        run: echo "CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci-select-xcode.sh >> "$GITHUB_ENV"

      - name: Bootstrap
        run: make bootstrap

      - name: Format check
        run: make lint

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: UI tests
        id: uitest
        if: env.FULL_TIER == 'true'
        run: make uitest

      # The audit may retry once after a timeout. Every audit and retry is
      # counted here, whether the UI tests passed or failed. A run that
      # recorded no audits fails: the recording is broken.
      - name: Accessibility audit summary
        id: audits
        if: ${{ !cancelled() && (steps.uitest.outcome == 'success' || steps.uitest.outcome == 'failure') }}
        run: |
          set -o pipefail
          scripts/accessibility-retries.py summarize build/accessibility/audits.log \
            --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output build/accessibility/record.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the audit record
        if: ${{ !cancelled() && steps.audits.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-audits-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/accessibility/record.json
          if-no-files-found: error
          retention-days: 90

      # Records come from any earlier full-suite run, on any branch. If the
      # listing fails there is no history folder, and the window step says
      # the count is unknown instead of failing.
      - name: Download earlier audit records
        if: ${{ !cancelled() && steps.audits.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # More than the window needs: this run's own record may be listed,
          # and the tool takes the newest ones.
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f per_page=100 \
            --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("accessibility-audits-"))]
                  | sort_by(.created_at) | reverse | .[:30][] | "\(.id) \(.name)"' \
            > build/accessibility/artifacts.txt
          mkdir -p build/accessibility/history
          while read -r id name; do
            # A record that cannot be fetched is left empty; the tool names it.
            record="build/accessibility/history/$name.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > build/accessibility/artifact.zip \
              && unzip -p build/accessibility/artifact.zip record.json > "$record" \
              || : > "$record"
          done < build/accessibility/artifacts.txt
          echo "Listed $(wc -l < build/accessibility/artifacts.txt | tr -d ' ') earlier record(s)"

      # Fails when this run retried and the last 20 full-suite runs then hold
      # more than 3 retries. The numbers are in the script and CONTRIBUTING.md.
      - name: Accessibility retry window
        if: ${{ !cancelled() && steps.audits.outcome == 'success' }}
        run: |
          set -o pipefail
          scripts/accessibility-retries.py check build/accessibility/record.json \
            build/accessibility/history | tee -a "$GITHUB_STEP_SUMMARY"

      # Reported, not blocking: runner timings vary too much to gate on yet.
      - name: Performance tests
        id: performance
        if: env.FULL_TIER == 'true'
        continue-on-error: true
        run: |
          mkdir -p build/performance
          # Without pipefail the pipe reports tee's status, so a failed
          # `make perf` would leave this step green and the note below unsent.
          set -o pipefail
          status=0
          make perf | tee build/performance/summary.txt || status=$?
          {
            echo '### Performance'
            echo
            echo '```'
            cat build/performance/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Note a performance failure
        if: steps.performance.outcome == 'failure'
        run: echo "::warning title=Performance tests::The performance tests did not complete. See the Performance tests step."

      # Every push to main gets a downloadable build. It is signed ad hoc,
      # not with a Developer ID, and is not notarized.
      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make package

      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Cairn-unsigned-${{ github.sha }}
          path: build/package/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/DerivedData/Logs/Test
            build/performance
            build/accessibility
          if-no-files-found: ignore
          retention-days: 7

      - name: Duration
        if: always()
        run: scripts/ci-duration.sh "$CI_STARTED"
