name: macOS 15

# The minimum supported macOS. Once a week it builds, runs the unit tests and
# runs the accessibility end-to-end tests: the audits and the keyboard-only
# tests, which are where macOS versions have differed. Started by hand, it runs
# every end-to-end test; do that on a branch before merging a step that leans
# on AppKit behaviour. It also runs in full on a pull request that changes this
# file or the Xcode selection script.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: End-to-end tests to run
        type: choice
        options: [full, audits]
        default: full
  pull_request:
    paths:
      - .github/workflows/macos-15.yml
      - scripts/ci-select-xcode.sh

concurrency:
  group: macos-15-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build and test on macOS 15
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The weekly run is trimmed; every other start runs what it was asked
      # for, and everything when it was not asked.
      UITEST_SUITE: ${{ github.event_name == 'schedule' && 'audits' || inputs.suite || 'full' }}
    steps:
      - name: Record the start time
        run: echo "CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Strict: the runner's default Xcode is older than the pinned major
      # version, so no Xcode of that version is a failure, not a fallback.
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh --strict >> "$GITHUB_ENV"

      # Read these before trusting a green run.
      - name: Report versions
        run: |
          {
            echo '### macOS 15 check'
            echo
            echo "- macOS: $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Swift: $(xcrun swift --version 2>&1 | sed -n 1p)"
            echo "- End-to-end tests: $UITEST_SUITE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bootstrap
        run: make bootstrap

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: UI tests
        id: uitest
        run: make uitest UITEST_SUITE="$UITEST_SUITE"

      # Shown only. These retries are not gated and do not count toward the
      # macOS 26 window in ci.yml.
      - name: Accessibility audit summary
        if: ${{ !cancelled() && (steps.uitest.outcome == 'success' || steps.uitest.outcome == 'failure') }}
        run: |
          set -o pipefail
          scripts/accessibility-retries.py summarize build/accessibility/audits.log \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-15
          path: build/DerivedData/Logs/Test
          if-no-files-found: ignore
          retention-days: 7

      # Also prints what a weekly run costs in a month, and warns past the limit.
      - name: Duration
        if: always()
        run: scripts/ci-duration.sh --weekly "$CI_STARTED"
